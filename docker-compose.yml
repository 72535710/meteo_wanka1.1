
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meteo-wanka-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meteo-wanka-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
